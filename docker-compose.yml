name: tictactoe

services:
  server:
    build:
      context: .
      dockerfile: TicTacToe.Server/Dockerfile
      target: production
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENV:-Production}
      - CorsOrigins=http://localhost:8080

  client:
    build:
      context: .
      dockerfile: TicTacToe.Client/Dockerfile
      target: production

  proxy:
    build:
      context: .
      dockerfile: nginx-proxy/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy