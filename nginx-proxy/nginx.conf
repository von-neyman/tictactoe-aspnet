server {
    listen 80;
    absolute_redirect off;

    location = /swagger {
        return 302 /swagger/;
    }

    location /swagger/ {
        proxy_pass http://server:8080;
    }

    location /game/ {
        proxy_pass http://server:8080;
    }

    location / {
        proxy_pass http://client:80;
    }
}